# Scrape targets, alert rules, the dashboard and the Grafana admin secret
# (observability domain). Needs the monitoring.coreos.com CRDs from the
# kube-prometheus-stack Application.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: integration-platform-lab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: observability
  source:
    repoURL: https://github.com/andrea-claro/integration-platform-lab.git
    targetRevision: main
    path: gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
