# App-of-apps (ADR-003): one Argo CD Application per component.
# The root Application itself is created by infra/bootstrap.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # AppProjects first (sync wave -20), then the Applications that use them.
  - projects.yaml
  # Phase 0
  - platform-base.yaml
  # Phase 1 - platform base
  - cert-manager.yaml
  - envoy-gateway.yaml
  - sealed-secrets.yaml
  - platform-guardrails.yaml
  - platform-pki.yaml
  - platform-gateway.yaml
  # Phase 2 - integration workloads
  - strimzi.yaml
  - streaming-kafka.yaml
  - iot-mosquitto.yaml
  - iot-device-simulator.yaml
  - iot-mqtt-kafka-bridge.yaml
  - apps-telemetry-api.yaml
  # Phase 3 - observability
  - kube-prometheus-stack.yaml
  - observability-config.yaml
