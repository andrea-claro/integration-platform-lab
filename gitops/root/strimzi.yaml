# Strimzi Kafka operator 1.3.1 (Kafka 4.2.0-4.3.2, tested on Kubernetes 1.32-1.37) - PLAN 2.1.
# Installed by the platform project because the chart ships CRDs and cluster RBAC;
# the operator runs in "streaming" and watches only that namespace.
# Only the kafka.strimzi.io/v1 API exists from Strimzi 1.0 on.
# Chart values: https://github.com/strimzi/strimzi-kafka-operator/blob/1.3.1/helm-charts/helm3/strimzi-kafka-operator/values.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: integration-platform-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    # Public OCI Helm chart: no repository credentials needed.
    repoURL: oci://quay.io/strimzi-helm/strimzi-kafka-operator
    targetRevision: 1.3.1
    path: .
    helm:
      releaseName: strimzi
      valuesObject:
        # Every pod the operator creates (Kafka, entity operator, Kafka Exporter)
        # gets a security context that meets the "restricted" Pod Security Standard.
        extraEnvs:
          - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
            value: restricted
        # Not in the PLAN §7 table: kept small, memory limit as in the chart.
        # CPU is requested but not limited (project convention).
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: null, memory: 384Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true   # the Strimzi CRDs exceed the client-side apply size limit
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
