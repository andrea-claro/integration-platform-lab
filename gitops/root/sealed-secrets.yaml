# Sealed Secrets controller 0.41.2 (chart 2.22.0) - ADR-005.
# Exception to the "no Bitnami charts or images" rule: this is the Sealed Secrets
# project's own chart and image (Apache-2.0, maintained by Bitnami), not the
# discontinued Bitnami application catalog.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: integration-platform-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.22.0
    helm:
      releaseName: sealed-secrets
      valuesObject:
        # Service and controller name expected by `make seal` (platform/sealed-secrets).
        fullnameOverride: sealed-secrets
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {memory: 128Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
