# Mosquitto 2.1 broker for the cluster (PLAN 2.2).
# Every client authenticates (password file from the SealedSecret
# "mosquitto-passwd") and may only use the topics its ACL allows.
# Plain MQTT on 1883: the broker is cluster-internal and NetworkPolicies let
# only the simulator and the bridge connect. TLS is a planned hardening step.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

# Keep queued QoS 1 messages of the bridge's persistent session across a
# broker restart (data on a PersistentVolumeClaim).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# Bound the queue of an offline persistent client (the bridge during a Kafka
# outage): beyond this, new messages for it are dropped and counted.
max_queued_messages 10000

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
