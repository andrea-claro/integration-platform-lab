# MQTT -> Kafka bridge (PLAN 2.4): devices/+/telemetry -> telemetry.raw.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: iot
labels:
  - pairs:
      app.kubernetes.io/name: mqtt-kafka-bridge
    includeSelectors: true
  - pairs:
      app.kubernetes.io/component: integration
      app.kubernetes.io/part-of: integration-platform-lab
      app.kubernetes.io/version: 0.1.0
    includeTemplates: true
resources:
  - sealedsecret-mqtt.yaml
  - mqtt-kafka-bridge.yaml
