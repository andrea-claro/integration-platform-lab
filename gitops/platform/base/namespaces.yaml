# One namespace per domain (CLAUDE.md conventions). `argocd` is created by the
# bootstrap and is intentionally not managed here.
#
# Pod Security Admission: enforce "baseline" everywhere, warn/audit on
# "restricted" so violations show up before we tighten enforcement.
# observability enforces "privileged" because node-exporter needs hostNetwork,
# hostPID and hostPath mounts (revisit in Phase 3: drop node-exporter or keep it).
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: streaming
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: iot
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    # May attach routes to the shared Gateway (platform/public).
    gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # May attach routes to the shared Gateway (platform/public).
    gateway-access: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
