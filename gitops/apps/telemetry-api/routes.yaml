# Two routes on the shared Gateway (platform/public), same hostname:
#   telemetry-api       /v1/*  data, API key required (SecurityPolicy)
#   telemetry-api-docs  /, /docs, /openapi.json  public, so visitors can read the
#                       docs and try the API with the published demo key
# Nothing else is routed: /healthz, /readyz and /metrics stay cluster-internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemetry-api
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform
      sectionName: https
  hostnames:
    - api.ipl.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: telemetry-api
          port: 80
      timeouts:
        request: 10s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: telemetry-api-docs
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: platform
      sectionName: https
  hostnames:
    - api.ipl.localhost
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /docs
        - path:
            type: Exact
            value: /openapi.json
      backendRefs:
        - name: telemetry-api
          port: 80
      timeouts:
        request: 10s
