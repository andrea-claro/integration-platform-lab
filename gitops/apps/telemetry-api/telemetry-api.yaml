apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-api
spec:
  # One replica: the latest readings live in memory and the consumer group
  # splits partitions between pods, so a second pod would see half the devices.
  # Rolling update with surge: the new pod replays the topic and becomes ready
  # (partitions assigned) before the old one stops.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {}
  template:
    spec:
      serviceAccountName: telemetry-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry-api
          image: ghcr.io/andrea-claro/ipl-telemetry-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: ipl-kafka-bootstrap.streaming.svc.cluster.local:9092}
            - {name: KAFKA_TOPIC, value: telemetry.raw}
            - {name: KAFKA_GROUP_ID, value: telemetry-api}
            - {name: HTTP_PORT, value: "8080"}
            - {name: LOG_LEVEL, value: INFO}
          ports:
            - name: http      # API, /healthz, /readyz, /metrics (only /v1 and the docs are routed)
              containerPort: 8080
          # Ready once the consumer has its partitions (warm store); stays ready
          # if Kafka goes away later and keeps serving the last known readings.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          # PLAN §7: our three services ~384 MiB together (idle RSS ~60 MiB).
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-api
spec:
  selector: {}
  ports:
    - name: http
      port: 80
      targetPort: http
