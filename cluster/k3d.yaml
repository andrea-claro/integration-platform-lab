# k3d cluster for integration-platform-lab (PLAN.md task 0.3).
# Docs: https://k3d.io/v5.9.0/usage/configfile/
#
#   make cluster   -> k3d cluster create --config cluster/k3d.yaml
#   make down      -> k3d cluster delete ipl
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ipl            # kube context: k3d-ipl
servers: 1
agents: 0
image: rancher/k3s:v1.35.10-k3s1
kubeAPI:
  hostIP: "127.0.0.1"  # API server reachable from this Mac only
  hostPort: "6445"
ports:
  # HTTPS into Envoy Gateway (Service type LoadBalancer, served by k3s servicelb).
  # Bound to loopback only: the public surface goes exclusively through cloudflared.
  - port: 127.0.0.1:8443:443
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
    timeout: "180s"
  k3s:
    extraArgs:
      # Gateway API with Envoy Gateway replaces the bundled Traefik (ADR-002).
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
