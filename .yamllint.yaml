extends: default

ignore: |
  .terraform/
  .venv/
  **/node_modules/

rules:
  line-length:
    max: 140
    level: warning
    # SealedSecret ciphertext is a single long base64 line by design.
    ignore: |
      **/sealedsecret-*.yaml
  document-start: disable
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
