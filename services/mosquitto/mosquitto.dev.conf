# Mosquitto config for the local compose stack ONLY.
# Anonymous access is acceptable here because the broker port is not published
# to the host; it is reachable only on the private compose network.
# The in-cluster broker (Phase 2.2) uses a password file from a SealedSecret.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
